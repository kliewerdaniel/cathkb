[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cathkb"
version = "1.0.0"
description = "Catholic Sovereign Knowledge System — Local-first doctrinal reasoning engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Daniel Kliewer" }]
keywords = ["catholic", "knowledge-base", "doctrinal-reasoning", "sovereign", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Religion",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
cathkb = "kb_tools.cli.main:cli"

[project.urls]
Repository = "https://github.com/danielkliewer/cathkb"

[tool.hatch.build.targets.wheel]
packages = ["kb_tools"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyinstaller]
onefile = true
name = "cathkb"
